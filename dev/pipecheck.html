<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>pipecheck</title></head>
  <body>
    <pre id="out">running…</pre>
    <div id="sheet"></div>
    <script type="module">
      import { cleanMask, sharpenAlpha, dropSpecks, fillHoles } from '/src/lib/mask.ts'
      import { normalizeGarment } from '/src/lib/normalize.ts'
      import { refineMatte } from '/src/lib/matte.ts'
      import { backend, isIsolated } from '/src/lib/backend.ts'

      const results = []
      const fail = []
      function check(name, cond, detail) {
        results.push(`${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? '  — ' + detail : ''}`)
        if (!cond) fail.push(name)
        document.getElementById('out').textContent = results.join('\n')
      }
      const near = (a, b, tol) => Math.abs(a - b) <= tol

      // ===================================================================
      // 1. Cross-origin isolation + backend selection
      // ===================================================================
      check('page is cross-origin isolated', isIsolated(), `crossOriginIsolated=${isIsolated()}`)
      check('SharedArrayBuffer available', typeof SharedArrayBuffer !== 'undefined')
      const be = await backend()
      results.push(`INFO  backend = ${be.device} / ${be.dtype}`)
      check('backend resolved', be.device === 'webgpu' || be.device === 'wasm', `${be.device}`)

      // ===================================================================
      // 2. Mask cleanup
      // ===================================================================
      const W = 200, H = 200
      const mask = new Uint8ClampedArray(W * H)
      const inSquare = (x, y) => x >= 50 && x < 150 && y >= 50 && y < 150
      // Solid garment...
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (inSquare(x, y)) mask[y * W + x] = 255
      // ...with the wide soft halo a 512px mask gets when it's upscaled...
      for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
          if (inSquare(x, y)) continue
          const dx = Math.max(50 - x, x - 149, 0)
          const dy = Math.max(50 - y, y - 149, 0)
          const d = Math.max(dx, dy)
          if (d > 0 && d <= 12) mask[y * W + x] = Math.round(255 * (1 - d / 13))
        }
      }
      // ...a speck of mis-labelled pixels...
      for (let y = 10; y < 14; y++) for (let x = 10; x < 14; x++) mask[y * W + x] = 255
      // ...and a pinhole inside the fabric.
      for (let y = 90; y < 96; y++) for (let x = 90; x < 96; x++) mask[y * W + x] = 0

      const before = mask.slice()
      const softBefore = before.reduce((n, v) => n + (v > 0 && v < 255 ? 1 : 0), 0)
      cleanMask(mask, W, H)
      const softAfter = mask.reduce((n, v) => n + (v > 0 && v < 255 ? 1 : 0), 0)

      check('halo band shrinks', softAfter < softBefore * 0.35, `${softBefore} -> ${softAfter} soft px`)
      // 16 is the alpha the rest of the pipeline treats as "transparent"
      // (trimTransparent, maskFromBlob) — anything under it contributes no
      // visible background colour.
      check('far halo below the visible threshold', mask[(50 - 8) * W + 100] <= 16,
        `a=${mask[(50 - 8) * W + 100]}`)
      check('garment interior kept', mask[100 * W + 100] === 255, `a=${mask[100 * W + 100]}`)
      check('pinhole filled', mask[92 * W + 92] === 255, `a=${mask[92 * W + 92]}`)
      check('speck removed', mask[12 * W + 12] === 0, `a=${mask[12 * W + 12]}`)

      // Two similar blobs (a pair of shoes) must both survive.
      const two = new Uint8ClampedArray(W * H)
      for (let y = 80; y < 120; y++) {
        for (let x = 20; x < 60; x++) two[y * W + x] = 255
        for (let x = 140; x < 180; x++) two[y * W + x] = 255
      }
      for (let y = 10; y < 13; y++) for (let x = 10; x < 13; x++) two[y * W + x] = 255
      dropSpecks(two, W, H)
      check('both shoes survive', two[100 * W + 40] === 255 && two[100 * W + 160] === 255)
      check('speck beside them removed', two[11 * W + 11] === 0)

      // ===================================================================
      // 3. Pose anchoring
      // ===================================================================
      function tee(ctx, S) {
        const p = [[-0.13,0],[-0.5,0.04],[-0.85,0.06],[-0.85,0.42],[-0.44,0.45],
                   [-0.48,1.4],[0.48,1.4],[0.44,0.45],[0.85,0.42],[0.85,0.06],[0.5,0.04],[0.13,0]]
        ctx.beginPath()
        p.forEach(([x, y], i) => (i ? ctx.lineTo(x * S, y * S) : ctx.moveTo(x * S, y * S)))
        ctx.closePath()
        ctx.fill()
      }
      async function renderTee(rotDeg, cw, ch, shoulderY) {
        const c = document.createElement('canvas')
        c.width = cw; c.height = ch
        const ctx = c.getContext('2d')
        ctx.save()
        ctx.translate(cw / 2, shoulderY)
        ctx.rotate((rotDeg * Math.PI) / 180)
        ctx.fillStyle = '#4477cc'
        tee(ctx, 300)
        ctx.restore()
        return await new Promise(r => c.toBlob(r, 'image/png'))
      }
      async function topOf(blob) {
        const bmp = await createImageBitmap(blob)
        const c = document.createElement('canvas')
        c.width = bmp.width; c.height = bmp.height
        const ctx = c.getContext('2d', { willReadFrequently: true })
        ctx.drawImage(bmp, 0, 0)
        const { data } = ctx.getImageData(0, 0, bmp.width, bmp.height)
        bmp.close()
        for (let y = 0; y < c.height; y++)
          for (let x = 0; x < c.width; x++)
            if (data[(y * c.width + x) * 4 + 3] > 16) return { top: y, w: c.width, h: c.height }
        return { top: -1, w: c.width, h: c.height }
      }

      const SHOULDER_Y = 180
      const flat = await renderTee(0, 900, 900, SHOULDER_Y)
      const noAnchor = await topOf(await normalizeGarment(flat, 'top', null, null))
      // An anchor deliberately placed well below the true shoulder line should
      // pull the garment UP the frame, because normalization aligns whatever
      // point it's given to the same canonical height.
      const lowAnchor = await topOf(
        await normalizeGarment(flat, 'top', null, { x: 450, y: SHOULDER_Y + 120 }),
      )
      check('pose anchor moves the hang line', lowAnchor.top < noAnchor.top - 20,
        `top ${lowAnchor.top} (anchored low) vs ${noAnchor.top} (silhouette)`)

      // An anchor at the true shoulder line should agree with the silhouette's
      // own estimate — the two methods must not disagree on a clean flat-lay.
      const trueAnchor = await topOf(
        await normalizeGarment(flat, 'top', null, { x: 450, y: SHOULDER_Y }),
      )
      check('pose anchor agrees with silhouette on a clean shot',
        near(trueAnchor.top, noAnchor.top, 30), `${trueAnchor.top} vs ${noAnchor.top}`)

      // The anchor is given in input pixels, so it has to survive straightening.
      const tilted = await renderTee(18, 1100, 1100, SHOULDER_Y)
      const rotAnchored = await topOf(
        await normalizeGarment(tilted, 'top', 18, { x: 550, y: SHOULDER_Y }),
      )
      check('anchor survives rotation', rotAnchored.top > 0 && rotAnchored.top < rotAnchored.h * 0.5,
        `top ${rotAnchored.top} of ${rotAnchored.h}`)
      check('rotated+anchored matches flat-lay', near(rotAnchored.top, trueAnchor.top, 45),
        `${rotAnchored.top} vs ${trueAnchor.top}`)

      // Out-of-frame anchors must be ignored, not obeyed.
      const bogus = await topOf(
        await normalizeGarment(flat, 'top', null, { x: 450, y: -5000 }),
      )
      check('off-image anchor ignored', near(bogus.top, noAnchor.top, 10),
        `${bogus.top} vs ${noAnchor.top}`)

      // ===================================================================
      // 4. ViTMatte refinement (downloads ~28 MB)
      // ===================================================================
      const MW = 512, MH = 512
      // A photo: red garment on a green background, with a soft edge.
      const photo = document.createElement('canvas')
      photo.width = MW; photo.height = MH
      {
        const ctx = photo.getContext('2d')
        ctx.fillStyle = '#2e8b57'
        ctx.fillRect(0, 0, MW, MH)
        ctx.fillStyle = '#c0392b'
        ctx.beginPath()
        ctx.ellipse(MW / 2, MH / 2, 150, 190, 0, 0, Math.PI * 2)
        ctx.fill()
      }
      const photoBlob = await new Promise(r => photo.toBlob(r, 'image/png'))

      // A deliberately sloppy cutout: the right shape, but with a 24px alpha ramp
      // — exactly the artefact a 512px mask leaves after it's upscaled.
      const coarse = document.createElement('canvas')
      coarse.width = MW; coarse.height = MH
      {
        const ctx = coarse.getContext('2d')
        ctx.drawImage(photo, 0, 0)
        const img = ctx.getImageData(0, 0, MW, MH)
        for (let y = 0; y < MH; y++) {
          for (let x = 0; x < MW; x++) {
            const dx = (x - MW / 2) / 150
            const dy = (y - MH / 2) / 190
            const d = Math.sqrt(dx * dx + dy * dy)
            const t = 1 - (d - 0.88) / 0.24 // ramp across the boundary
            img.data[(y * MW + x) * 4 + 3] = Math.max(0, Math.min(255, Math.round(255 * t)))
          }
        }
        ctx.putImageData(img, 0, 0)
      }
      const coarseBlob = await new Promise(r => coarse.toBlob(r, 'image/png'))

      async function alphaStats(blob) {
        const bmp = await createImageBitmap(blob)
        const c = document.createElement('canvas')
        c.width = bmp.width; c.height = bmp.height
        const ctx = c.getContext('2d', { willReadFrequently: true })
        ctx.drawImage(bmp, 0, 0)
        const { data } = ctx.getImageData(0, 0, c.width, c.height)
        bmp.close()
        let soft = 0, opaque = 0, clear = 0
        for (let i = 3; i < data.length; i += 4) {
          const a = data[i]
          if (a === 0) clear++
          else if (a === 255) opaque++
          else soft++
        }
        return { soft, opaque, clear, w: c.width, h: c.height }
      }

      const inStats = await alphaStats(coarseBlob)
      let refined = null
      const t0 = performance.now()
      try {
        refined = await refineMatte(photoBlob, coarseBlob, m => {
          document.getElementById('out').textContent = results.join('\n') + '\n… ' + m
        })
      } catch (e) {
        results.push('INFO  refineMatte threw: ' + e.message)
      }
      const cold = Math.round(performance.now() - t0)
      // Second run reuses the loaded model, so it isolates inference from the
      // one-off download+compile.
      const t1 = performance.now()
      if (refined) await refineMatte(photoBlob, coarseBlob)
      const warm = Math.round(performance.now() - t1)
      results.push(`INFO  matte cold ${cold}ms / warm ${warm}ms`)

      check('ViTMatte returned a result', refined !== null, refined ? `${cold}ms` : 'null')
      if (refined) {
        const outStats = await alphaStats(refined)
        check('matte keeps source resolution', outStats.w === MW && outStats.h === MH,
          `${outStats.w}x${outStats.h}`)
        check('matte edge is tighter than the coarse ramp', outStats.soft < inStats.soft * 0.8,
          `${inStats.soft} -> ${outStats.soft} soft px`)
        check('matte keeps the garment', outStats.opaque > MW * MH * 0.15,
          `${Math.round((outStats.opaque / (MW * MH)) * 100)}% opaque`)
        check('matte keeps a background', outStats.clear > MW * MH * 0.3,
          `${Math.round((outStats.clear / (MW * MH)) * 100)}% clear`)
        check('matte is not degenerate',
          outStats.opaque < MW * MH * 0.95 && outStats.clear < MW * MH * 0.95)

        // The strict correctness check: the alpha has to actually track the
        // ellipse, not merely be non-degenerate. A quantization fault (the
        // known "ghosting" failure on the WebGPU backend) shows up here as a
        // low interior alpha or a high exterior one, where the bulk statistics
        // above would still look plausible.
        const rbmp = await createImageBitmap(refined)
        const rc = document.createElement('canvas')
        rc.width = MW; rc.height = MH
        const rctx = rc.getContext('2d', { willReadFrequently: true })
        rctx.drawImage(rbmp, 0, 0)
        const rdata = rctx.getImageData(0, 0, MW, MH).data
        rbmp.close()
        const alphaAt = (x, y) => rdata[((y * MW + x) << 2) + 3]
        const inside = [[256, 256], [256, 180], [256, 330], [200, 256], [312, 256]]
        const outside = [[20, 20], [492, 20], [20, 492], [492, 492], [256, 20], [256, 492]]
        const minIn = Math.min(...inside.map(([x, y]) => alphaAt(x, y)))
        const maxOut = Math.max(...outside.map(([x, y]) => alphaAt(x, y)))
        check('matte opaque across the garment interior', minIn >= 250, `min alpha ${minIn}`)
        check('matte transparent across the background', maxOut <= 8, `max alpha ${maxOut}`)

        const img = new Image()
        img.src = URL.createObjectURL(refined)
        img.style.cssText = 'height:220px;border:1px solid #ccc;margin:4px;background:#eee'
        img.title = 'refined'
        document.getElementById('sheet').appendChild(img)
      }

      document.getElementById('out').textContent =
        results.join('\n') + `\n\n${fail.length ? 'FAILURES: ' + fail.length : 'ALL PASS'}`
      window.__done = true
      window.__fail = fail.length
    </script>
  </body>
</html>
